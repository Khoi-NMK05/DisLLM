name: Release Windows Build

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Verify tag matches bot/version.py
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        run: |
          $tagVersion = "${{ github.ref_name }}".TrimStart("v")
          $appVersion = python -c "from bot.version import APP_VERSION; print(APP_VERSION)"
          if ($tagVersion -ne $appVersion.Trim()) {
            Write-Error "Tag version ($tagVersion) does not match bot/version.py ($appVersion). Update APP_VERSION first."
            exit 1
          }

      - name: Run unit tests
        run: python -m unittest discover -s tests -v

      - name: Build DisLLM executable, portable zip, and Inno Setup installer
        run: python build_exe.py

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: DisLLM-Windows-Release
          path: |
            dist/DisLLM-Setup-v*.exe
            dist/DisLLM-v*-win64.zip
            dist/checksums.txt

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            dist/DisLLM-Setup-v*.exe
            dist/DisLLM-v*-win64.zip
            dist/checksums.txt
